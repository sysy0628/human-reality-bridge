services:
  reality-bridge:
    build: .
    container_name: human-reality-bridge
    restart: unless-stopped
    init: true
    environment:
      BRIDGE_CONFIG: /app/config/config.json
      BRIDGE_DATA_DIR: /app/data
      BRIDGE_POLL_MINUTES: ${BRIDGE_POLL_MINUTES:-10}
      BRIDGE_SEND_STARTUP_TEST: ${BRIDGE_SEND_STARTUP_TEST:-false}
    volumes:
      - bridge-config:/app/config
      - bridge-data:/app/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    mem_limit: 128m
    cpus: 0.25
    pids_limit: 64
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "3"

volumes:
  bridge-config:
  bridge-data:
