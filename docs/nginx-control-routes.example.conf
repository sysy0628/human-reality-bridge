# 放入已配置 TLS 的 server {} 内；将 CONTROL_LOOPBACK_PORT 替换为 control 的回环端口。
# 只开放已知 API，不要代理任意路径。
location ~ ^/v1/(?:location(?:/status)?|environment/current|settings/environment)$ {
    limit_except GET PUT OPTIONS { deny all; }
    proxy_pass https://127.0.0.1:CONTROL_LOOPBACK_PORT;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Origin $http_origin;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Content-Type $content_type;
    proxy_set_header X-Forwarded-Proto https;
    proxy_ssl_verify on;
    proxy_ssl_trusted_certificate /ABSOLUTE/PATH/TO/control-tls.crt;
    proxy_ssl_verify_depth 2;
    proxy_ssl_server_name on;
    proxy_ssl_name human-reality-bridge-control;
    proxy_connect_timeout 5s;
    proxy_read_timeout 20s;
}
location = /v1/pairing/aru-trigger {
    limit_except GET PUT OPTIONS { deny all; }
    proxy_pass https://127.0.0.1:CONTROL_LOOPBACK_PORT;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Origin $http_origin;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Content-Type $content_type;
    proxy_set_header X-Forwarded-Proto https;
    proxy_ssl_verify on;
    proxy_ssl_trusted_certificate /ABSOLUTE/PATH/TO/control-tls.crt;
    proxy_ssl_verify_depth 2;
    proxy_ssl_server_name on;
    proxy_ssl_name human-reality-bridge-control;
}
location / { return 404; }
