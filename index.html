<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#e4eee8"><meta name="x-settings-base-url" content="__SETTINGS_BASE_URL__"><meta name="x-settings-token" content="__SETTINGS_TOKEN__"><title>人类现实感应桥</title><link rel="stylesheet" href="./src/styles.css"><link rel="stylesheet" href="./src/presence.css"></head><body><main class="shell"><section class="hero"><p class="eyebrow">Human Reality Bridge · Prototype</p><h1>人类现实感应桥</h1><p class="subtitle">把使用者所处的人类现实环境数据，整理成客观、克制且可自定义的环境更新。</p><div class="status-line"><span class="pill"><i class="dot" id="masterDot"></i><span id="masterStatus">递送总开关开启</span></span><span class="pill" id="observedAt">正在同步天气</span><span class="pill" id="dataMode">等待配置</span></div></section><section class="grid"><article class="card"><div class="card-head"><h2>此刻的人类现实环境</h2><span class="badge" id="presence">未设置</span></div><div class="weather-row"><div class="weather-icon" id="weatherIcon">☁️</div><div><div class="temperature" id="temperature">--°</div><div class="condition" id="condition">正在读取天气</div></div></div><div class="metrics"><div class="metric"><span>湿度</span><strong id="humidity">--</strong></div><div class="metric"><span>风</span><strong id="wind">--</strong></div><div class="metric"><span>空气</span><strong id="air">--</strong></div><div class="metric"><span>紫外线</span><strong id="uvIndex">--</strong></div></div><p class="summary" id="summary"></p><div class="change" id="change"></div><div class="actions"><button class="btn primary" id="simulateButton">模拟下一次变化</button><button class="btn" id="previewButton">预览递送文案</button></div><pre class="preview" id="deliveryPreview"></pre></article><aside class="card"><div class="card-head"><h2>数据来源</h2><span class="badge wait" id="sourceOverallStatus">同步中</span></div><div class="source-list"><div class="source"><div><strong>天气服务</strong><br><small>天气、温湿度、风、紫外线</small></div><span class="badge wait" id="weatherSourceStatus">同步中</span></div><div class="source"><div><strong>Aru 外部触发器</strong><br><small>自动投递环境事件</small></div><span class="badge" id="triggerSourceStatus">由知舟管理</span></div></div><div class="actions"><button class="btn" id="masterButton">暂停递送</button></div></aside><article class="card full"><div class="card-head"><h2>递送规则</h2><span class="badge">自动保存</span></div><nav class="tabs" aria-label="设置分类"><button class="tab active" data-tab="source">地点与数据</button><button class="tab" data-tab="schedule">定时递送</button><button class="tab" data-tab="change">变化递送</button><button class="tab" data-tab="templates">文案模板</button><button class="tab" data-tab="custom">自定义规则</button><button class="tab" data-tab="quiet">免打扰</button></nav><div class="settings" id="settings"></div></article></section></main><div class="toast" id="toast" role="status"></div><script src="./src/templates.js"></script><script src="./src/environment.js"></script><script src="./src/weather-service.js"></script><script src="./src/rule-engine.js"></script><script src="./src/settings-client.js"></script><script src="./src/app.js"></script><script src="./src/presence.js"></script><script src="./src/persistence.js"></script><script src="./src/status-ui.js"></script><script src="./src/uv-ui.js"></script></body></html>
