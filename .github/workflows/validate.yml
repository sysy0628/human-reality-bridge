name: Validate private build

on:
  push:
    branches: [main, ci/verify-private-build]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  syntax-server:
    name: Syntax — server
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: find server -type f -name '*.js' -print0 | xargs -0 -n1 node --check

  syntax-browser:
    name: Syntax — browser
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: find src -type f -name '*.js' -print0 | xargs -0 -n1 node --check

  syntax-tests:
    name: Syntax — tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: find test -type f -name '*.js' -print0 | xargs -0 -n1 node --check

  tests:
    name: Test — ${{ matrix.file }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        file:
          - test/bootstrap.test.js
          - test/bridge.test.js
          - test/card-config.test.js
          - test/config-writer.test.js
          - test/config.test.js
          - test/core.test.js
          - test/health.test.js
          - test/safe-log.test.js
          - test/startup-test.test.js
          - test/store.test.js
          - test/templates.test.js
          - test/wake-sender.test.js
          - test/weather.test.js
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test "${{ matrix.file }}"

  docker:
    name: Base Docker build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build base image without sender or secrets
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: human-reality-bridge:ci
      - name: Inspect image paths
        shell: bash
        run: |
          set -euo pipefail
          cid="$(docker create human-reality-bridge:ci)"
          trap 'docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          listing="$(docker export "$cid" | tar -tf -)"
          if printf '%s\n' "$listing" | grep -E '(^|/)(\.env|config\.json|.*sender-bundle.*\.json|secrets?)(/|$)'; then
            echo 'Forbidden secret-like path found in image' >&2
            exit 1
          fi
