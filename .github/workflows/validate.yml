name: Validate private build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  node:
    name: Syntax and mock tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check
        run: npm run check
      - name: Mock test suite
        run: npm test

  docker:
    name: Base Docker build and container smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build base image without sender or secrets
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: human-reality-bridge:ci
      - name: Inspect image paths
        shell: bash
        run: |
          set -euo pipefail
          cid="$(docker create human-reality-bridge:ci)"
          trap 'docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          listing="$(docker export "$cid" | tar -tf -)"
          if printf '%s\n' "$listing" | grep -E '(^|/)(\.env|config\.json|.*sender-bundle.*\.json|secrets?)(/|$)'; then
            echo 'Forbidden secret-like path found in image' >&2
            exit 1
          fi
      - name: Run disabled container smoke test
        shell: bash
        run: bash scripts/smoke-disabled-container.sh human-reality-bridge:ci
      - name: Run offline mock sender integration
        shell: bash
        run: bash scripts/smoke-mock-sender-container.sh human-reality-bridge:ci
